# Shared sandbox for the opendata units (drop-in, installed as
# /etc/systemd/system/opendata-{scan,api,watch}.service.d/10-hardening.conf).
[Service]
User=opendata
Group=opendata
Environment=OPENDATA_PUBLIC=/srv/www/data.tn3w.dev
Restart=always
RestartSec=2s
Nice=15
UMask=0022
CapabilityBoundingSet=
AmbientCapabilities=
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RemoveIPC=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
LogRateLimitIntervalSec=30s
LogRateLimitBurst=100
