[package]
name = "opendata"
version = "0.1.0"
edition = "2024"
description = "Lookup API, abuse and crawler IP lists served at data.tn3w.dev"
license = "MIT"
publish = false

[workspace]
members = ["rdns"]

[dependencies]
axum = "0.8"
iscrawl = { version = "1.2.1", features = ["database"] }
listenfd = "1"
rdns = { path = "rdns" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
